[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-regression-plugin-sdk"
version = "0.1.0a1"
description = "Typed plugin contracts and explicit loading for Prompt Regression Diagnosis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Prompt Regression Diagnosis contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["prompt-regression-core>=0.1.0a1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_regression_plugin_sdk = ["py.typed"]
