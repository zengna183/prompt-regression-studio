name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-security:
    name: Production dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  python-core:
    name: Python core and official plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile first-party Python packages
        run: >-
          python -m compileall -q
          packages/python/core/src packages/python/core/tests
          packages/python/plugin-sdk/src packages/python/plugin-sdk/tests
          plugins/official/promptfoo/src plugins/official/promptfoo/tests
          scripts/run-python-tests.py
      - name: Run Python contract and diagnosis tests
        run: python scripts/run-python-tests.py
      - name: Build the Python wheels
        run: |
          python -m pip wheel --no-deps --wheel-dir dist/python packages/python/core
          python -m pip wheel --no-deps --wheel-dir dist/python packages/python/plugin-sdk
          python -m pip wheel --no-deps --wheel-dir dist/python plugins/official/promptfoo
      - name: Validate and diagnose the golden example
        env:
          PYTHONPATH: packages/python/core/src
        run: |
          python -m prompt_regression_core validate examples/missing-information-regression/regression-bundle.json
          python -m prompt_regression_core diagnose examples/missing-information-regression/regression-bundle.json --out /tmp/diagnosis-report.json --require-supported-hypothesis
      - name: Verify installed wheels and external CI runner
        run: |
          python -m venv "$RUNNER_TEMP/prs-packages"
          "$RUNNER_TEMP/prs-packages/bin/python" -m pip install --no-index --find-links dist/python prompt-regression-core prompt-regression-plugin-sdk prompt-regression-importer-promptfoo
          "$RUNNER_TEMP/prs-packages/bin/python" scripts/test-installed-packages.py

  regression-action:
    name: Reusable regression Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject a regressed prompt even with an explained cause
        id: rejected
        continue-on-error: true
        uses: ./.github/actions/prompt-regression
        with:
          bundle: examples/missing-information-regression/regression-bundle.json
          output-directory: artifacts/rejected-prompt
      - name: Verify rejection includes reports and outputs
        env:
          CHECK_OUTCOME: ${{ steps.rejected.outcome }}
          GATE_PASSED: ${{ steps.rejected.outputs.passed }}
        run: |
          test "$CHECK_OUTCOME" = failure
          test "$GATE_PASSED" = false
          test -f artifacts/rejected-prompt/report.json
          test -f artifacts/rejected-prompt/report.md
          test -f artifacts/rejected-prompt/regressions.csv
      - name: Apply an explicit regression tolerance
        uses: ./.github/actions/prompt-regression
        with:
          bundle: examples/missing-information-regression/regression-bundle.json
          output-directory: artifacts/tolerated-prompt
          max-regressions: "2"

  verify:
    name: TypeScript foundation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: eval
          POSTGRES_DB: eval_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eval -d eval_studio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Produce report for cross-language contract validation
        env:
          PYTHONPATH: packages/python/core/src
        run: python -m prompt_regression_core check examples/missing-information-regression/regression-bundle.json --out-dir /tmp/prs-contract --max-regressions 2
      - run: pnpm contracts:check -- /tmp/prs-contract/report.json /tmp/prs-contract/check.json
      - name: Validate database migration metadata
        env:
          DATABASE_URL: postgres://eval:eval@localhost:5432/eval_studio
        run: pnpm db:check
      - run: pnpm format:check
      - run: pnpm test:system:guards
      - run: pnpm test:operations
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://eval:eval@localhost:5432/eval_studio_test
      - run: pnpm build
      - name: Smoke test HTTP API through the real Python Core
        run: pnpm smoke:diagnosis-api

  system:
    name: Real services workflow and fault acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: eval
          POSTGRES_DB: prs_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eval -d prs_system_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm packages:build
      - run: pnpm --filter @ai-chat-eval/api --filter @ai-chat-eval/worker build
      - name: Install PostgreSQL 17 backup tools
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --retry 3 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: pnpm test:system
        env:
          TEST_SYSTEM_DATABASE_URL: postgres://eval:eval@127.0.0.1:5432/prs_system_test
          TEST_SYSTEM_REDIS_URL: redis://127.0.0.1:6379/15
      - name: Print system acceptance report
        if: always()
        run: test ! -f artifacts/system-test-report.json || cat artifacts/system-test-report.json

  browser:
    name: Real browser workflow acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: eval
          POSTGRES_DB: prs_system_test_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eval -d prs_system_test_browser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm packages:build
      - run: pnpm --filter @ai-chat-eval/api --filter @ai-chat-eval/worker build
      - run: pnpm test:browser
        env:
          TEST_SYSTEM_DATABASE_URL: postgres://eval:eval@127.0.0.1:5432/prs_system_test_browser
          TEST_SYSTEM_REDIS_URL: redis://127.0.0.1:6379/15
      - name: Print browser acceptance report
        if: always()
        run: test ! -f artifacts/browser/acceptance.json || cat artifacts/browser/acceptance.json

  deployment:
    name: Production containers and TLS deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/test-deployment.mjs
      - name: Print deployment acceptance report
        if: always()
        run: test ! -f artifacts/deployment-test-report.json || cat artifacts/deployment-test-report.json
