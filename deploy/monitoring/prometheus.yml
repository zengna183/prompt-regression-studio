global:
  scrape_interval: 30s
  scrape_timeout: 10s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prs-api
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/prs_metrics_token
    static_configs:
      - targets: ["api:4000"]
  - job_name: prs-worker
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/prs_metrics_token
    static_configs:
      - targets: ["worker:4101"]
# Configure your Alertmanager destination before relying on notifications.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]
