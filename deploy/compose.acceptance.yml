# CI only. Disposable TLS services, with a one-day certificate generated by the acceptance script.
services:
  api:
    environment:
      NODE_EXTRA_CA_CERTS: /certs/server.crt
    volumes: ["../artifacts/deployment-certs:/certs:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    environment:
      NODE_EXTRA_CA_CERTS: /certs/server.crt
    volumes: ["../artifacts/deployment-certs:/certs:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: acceptance-only
      POSTGRES_DB: prs_deploy_test
    volumes: ["../artifacts/deployment-certs:/certs:ro"]
    entrypoint:
      - /bin/sh
      - -c
      - cp /certs/server.key /tmp/server.key && chown postgres:postgres /tmp/server.key && chmod 600 /tmp/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/tmp/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d prs_deploy_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    volumes: ["../artifacts/deployment-certs:/certs:ro"]
    entrypoint:
      - /bin/sh
      - -c
      - cp /certs/server.key /tmp/server.key && chown redis:redis /tmp/server.key && chmod 600 /tmp/server.key && exec docker-entrypoint.sh redis-server --port 0 --tls-port 6379 --tls-cert-file /certs/server.crt --tls-key-file /tmp/server.key --tls-ca-cert-file /certs/server.crt --tls-auth-clients no
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/certs/server.crt", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
